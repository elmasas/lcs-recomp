[Display]
; PSP, Scale, Custom (Width, Height) or Desktop.
ResolutionMode=Scale
Scale=2
Fullscreen=true
UpscaleFilter=Bilinear
IntegerScale=false
ShowFPS=false
VSync=true
HudScale=1.00
; Auto = Xbox with a controller plugged in at start, else keyboard and mouse.
; Keyboard (kb) = the keys bound in [Controls]. Xbox = A/B/X/Y.
; Original = PlayStation glyphs. Restart after editing.
ButtonPrompts=Auto

[Rendering]
Backend=DirectX12 ; Windows uses DirectX 12. Linux selects the Vulkan GE for this value.
; PSP, Scale, Custom (InternalWidth, InternalHeight) or Desktop.
InternalResolutionMode=Scale
InternalScale=3
MSAA=8
AnisotropicFiltering=16
; -8 to 8. Negative keeps distant textures sharper.
TextureLodBias=1.00
; LOD and draw distance, 1 to 4. 1 is the original.
; At 2 and above, neighbouring sectors supply detailed scenery in place of nearby coarse LODs.
ViewDistance=4.00

[Widescreen]
Enabled=true
AspectRatio=auto

[Controls]
MouseSensitivity=13
CameraSmoothing=50
AutoAim=true ; controller only; keyboard and mouse always aim manually

; Mouse and keyboard. The pause menu (CONTROLS > KEYBOARD AND MOUSE) sets
; these too. After editing here, restart. Names ignore case.
; Several keys: separate with commas. None clears a binding.
; Shift, Ctrl, and Alt set both sides.
; F10 opens host settings. F11 toggles fullscreen.
; Letters, digits, F1-F9, F12, Space, Enter, Escape, Tab, Backspace,
; LeftShift, RightShift, LeftCtrl, RightCtrl, LeftAlt, RightAlt,
; Up, Down, Left, Right, Numpad0-Numpad9, NumpadPlus, NumpadMinus,
; Delete, Insert, Home, End, PageUp, PageDown, Comma, Period, Minus, Equals,
; MouseLeft, MouseRight, MouseMiddle, Mouse4, Mouse5, WheelUp, WheelDown.
; On foot, Move* is the stick. In a vehicle, MoveForward accelerates,
; MoveBack brakes, MoveLeft and MoveRight steer, and Up and Down pitch.
; Sprint and Aim are not sent in a vehicle. Handbrake is.
; LookLeft and LookRight look out of the side window in a vehicle; Attack
; then fires a drive-by. Both together look behind. In a vehicle their keys
; do not also change the radio station.
MoveForward=W
MoveBack=S
MoveLeft=A
MoveRight=D
Walk=LeftAlt
Sprint=LeftShift
Jump=Space
EnterVehicle=F,Enter
Attack=MouseLeft
Aim=MouseRight
CenterCamera=H,MouseMiddle
WeaponPrevious=Q,Left,WheelUp
WeaponNext=E,Right,WheelDown
Up=Up
Down=Down
Pause=Escape
Camera=V
Handbrake=Space
LookLeft=Q
LookRight=E

; Controller. Xbox names. On a PlayStation pad, A is Cross, B is Circle,
; X is Square, and Y is Triangle. The value is an action from the list above.
; A trigger does not send its buttons in a vehicle. MoveForward still
; accelerates and MoveBack still brakes.
; LeftStick and RightStick are Move or Camera.
; Left stick click is the horn in a vehicle.
PadA=Sprint
PadB=Attack
PadX=Jump
PadY=EnterVehicle
PadLeftShoulder=CenterCamera
PadRightShoulder=Aim
PadLeftTrigger=MoveBack,CenterCamera
PadRightTrigger=MoveForward,Aim
PadStart=Pause
PadBack=Camera
PadDpadUp=Up
PadDpadDown=Down
PadDpadLeft=WeaponPrevious
PadDpadRight=WeaponNext
PadLeftStickClick=Down
PadRightStickClick=None
LeftStick=Move
RightStick=Camera

InvertCameraY=false
[Timing]
; 30 or 60. Tested at 60.
FrameRate=60
; Skip the 60 Hz sleep. Used for testing.
Uncapped=false
